<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Aluno | MyPersonal</title>
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <link rel="stylesheet" href="../../assets/css/pages/perfil.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body data-profile="personal-trainer" data-active-page="alunos" data-page-title="Perfil do Aluno - Eliabe Monteiro">

    <div class="app-layout">
        <div id="sidebar-mount"></div>
        <div id="topbar-mount"></div>

        <main class="main-content conteudo-perfil">

                <div class="bloco-cabecalho-aluno">
                    <div class="foto-perfil-grande">EM</div>
                    <div class="informacoes-aluno">
                        <div class="nome-aluno">Eliabe Monteiro</div>
                        <div class="metadados-aluno">Aluno desde Jan/2025  ·  Personal: Pierre</div>
                    </div>
                    <div class="limpar-flutuacao"></div>
                </div>

                <div class="abas-navegacao">
                    <a href="#treino" class="botao-aba aba-ativa">Treino</a><a href="#dieta" class="botao-aba">Dieta</a><a href="#estatisticas" class="botao-aba">Estatísticas</a>
                </div>

                <div class="grade-conteudo">
                    <div class="coluna-esquerda">
                        <section class="secao-conteudo">
                            <h2 class="titulo-secao">Treino atual</h2>
                            <div class="caixa-conteudo caixa-treino-atual">
                                <div class="texto-interno-placeholder">[tabela: exercício / séries / reps / observação / vídeo]</div>
                            </div>
                            <a href="editar-treino.html" class="botao-principal-arredondado" style="text-decoration: none; text-align: center;">Editar treino</a>
                        </section>
                    </div>

                    <div class="coluna-direita">
                        <section class="secao-conteudo">
                            <h2 class="titulo-secao">Última avaliação</h2>
                            <div class="caixa-conteudo caixa-ultima-avaliacao">
                                [medidas corporais: peso / %gordura / etc]
                            </div>
                        </section>

                        <section class="secao-conteudo">
                            <h2 class="titulo-secao">Observações do profissional</h2>
                            <div class="caixa-conteudo caixa-observacoes">
                                [textarea: observações livres]
                            </div>
                            <button type="button" class="botao-principal-arredondado">Salvar</button>
                        </section>
                    </div>
                </div>
        </main>

    </div>

    <script src="../../assets/js/sidebar-loader.js"></script>
</body>
</html>
